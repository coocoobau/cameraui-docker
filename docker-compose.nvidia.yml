# NVIDIA NVENC/NVDEC + CUDA overlay.
# Requires the NVIDIA Container Toolkit on the host.
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
name: cameraui

services:
  cameraui:
    image: ghcr.io/cameraui/camera.ui:nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    # iGPU + NVIDIA combo: uncomment to also pass the Intel/AMD render node,
    # then decode can run on the iGPU (vaapi) while CUDA does inference
    # devices:
    #   - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, video, utility]
